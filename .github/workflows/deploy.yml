name: Test and deploy

# The site used to deploy straight from the main branch, which meant every push
# went live unchecked. Now a push runs the pre-flight suite first and only
# publishes if it passes.
#
# NOTE: this only takes effect once the repository's Pages source is set to
# "GitHub Actions" (Settings -> Pages -> Build and deployment -> Source).
# While the source is still "Deploy from a branch", GitHub keeps publishing
# unchecked and this workflow just reports status.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so a run that is already
# publishing is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Pre-flight tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Run pre-flight suite
        run: npm test

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/results.json
          if-no-files-found: warn
          retention-days: 30

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    # Pull requests are tested but never published. Pushes to main and manual
    # runs both deploy, so "Run workflow" doubles as a re-deploy button.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
