<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Portfolio tests</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
            margin: 0;
            padding: 24px;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 13px;
            line-height: 1.5;
        }

        h1 { font-size: 18px; margin: 0 0 4px; }
        .sub { color: #94a3b8; margin: 0 0 20px; font-size: 12px; }

        .status {
            padding: 12px 16px;
            border-radius: 6px;
            font-weight: 700;
            margin-bottom: 20px;
            background: #1e293b;
            border-left: 4px solid #64748b;
        }
        .status.pass { border-left-color: #10b981; color: #6ee7b7; }
        .status.fail { border-left-color: #ef4444; color: #fca5a5; }
        .status.warn { border-left-color: #f59e0b; color: #fcd34d; }

        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 2px solid #334155;
            color: #94a3b8;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        td { padding: 7px 10px; border-bottom: 1px solid #1e293b; vertical-align: top; }

        .group { color: #93c5fd; white-space: nowrap; width: 1%; }
        .name { width: 40%; }
        .state { font-weight: 700; white-space: nowrap; width: 1%; }
        tr.pass .state { color: #10b981; }
        tr.fail .state { color: #ef4444; }
        tr.skip .state { color: #f59e0b; }
        tr.warn .state { color: #f59e0b; }
        tr.warn { background: rgba(245, 158, 11, 0.06); }
        tr.warn .detail { color: #fcd34d; }
        tr.fail { background: rgba(239, 68, 68, 0.07); }
        tr.skip { background: rgba(245, 158, 11, 0.06); }
        tr.skip .detail { color: #fcd34d; }
        .detail { color: #fca5a5; }

        /* The site under test.
           This must be fully visible and unscaled. Chrome clips an iframe's
           IntersectionObserver root to the area actually visible in the parent,
           so hiding, shrinking or layering this frame behind other content
           stops the site's scroll-reveal observers from ever firing — and the
           suite would then report every section as invisible. */
        #site-frame {
            display: block;
            width: 1024px;
            height: 720px;
            border: 1px solid #334155;
            background: white;
            margin-bottom: 24px;
        }

        .frame-label {
            color: #94a3b8;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0 0 6px;
        }
    </style>
</head>
<body>
    <h1>Portfolio pre-flight tests</h1>
    <p class="sub">Loads index.html and asserts against the real rendered page. Run this before every deploy.</p>

    <p class="frame-label">Site under test</p>
    <iframe id="site-frame" title="Site under test"></iframe>

    <div class="status" id="status">Loading the site…</div>

    <table>
        <thead>
            <tr><th>Group</th><th>Check</th><th>Result</th><th>Detail</th></tr>
        </thead>
        <tbody id="results"></tbody>
    </table>

    <script src="./tests.js"></script>
</body>
</html>
